name: CI

# Builds the release configuration and runs the unit tests. Runs for every
# pull request, and on demand from the Actions tab for any branch. The
# repository is public, so standard runners cost nothing; the release
# workflow runs the same tests again before it signs anything.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # macOS 26 for the Xcode 26 SDK: older SDKs lack FoundationModels, and the
    # build then leaves Apple Intelligence out without complaint.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
