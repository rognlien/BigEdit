name: CI

# Builds the release configuration and runs the unit tests, on demand only.
# macOS runners are expensive for a private repository, so this no longer
# runs on every push and pull request: run it from the Actions tab when a
# branch needs checking, and rely on the release workflow — which runs the
# same tests before it signs anything — for every tagged release.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
